name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: ["backend/**", "ml/**", "requirements.txt", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "ml/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: emlak
          POSTGRES_PASSWORD: emlak_dev_password
          POSTGRES_DB: emlak_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check backend/app backend/tests

      - name: Black format kontrolü
        run: black --check backend/app backend/tests

      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg2://emlak:emlak_dev_password@localhost:5432/emlak_test
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Coverage raporu
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false
